name: BrowserProof regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browserproof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Local browser regressions and static viewer
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Day 3 verification and capture process exit codes
        id: verification
        shell: bash
        run: |
          mkdir -p ci-evidence
          set +e
          pnpm typecheck > ci-evidence/typecheck.log 2>&1; typecheck_rc=$?
          pnpm test > ci-evidence/tests.log 2>&1; test_rc=$?
          pnpm bp regression --fixture regressions/adminbench-dom-reorder --agent hardened > ci-evidence/regression-hardened.log 2>&1; hardened_rc=$?
          pnpm bp regression --fixture regressions/adminbench-dom-reorder --agent vulnerable > ci-evidence/regression-vulnerable.log 2>&1; vulnerable_rc=$?
          pnpm bp verify > ci-evidence/m0-verify.log 2>&1; m0_rc=$?
          pnpm bp verify --scenario adminbench > ci-evidence/adminbench-verify.log 2>&1; adminbench_rc=$?
          pnpm viewer:build > ci-evidence/viewer-build.log 2>&1; viewer_build_rc=$?
          pnpm viewer:smoke > ci-evidence/viewer-smoke.log 2>&1; viewer_smoke_rc=$?
          set -e
          printf 'typecheck=%s\ntest=%s\nhardened_regression=%s\nvulnerable_negative_control=%s\nm0_verify=%s\nadminbench_verify=%s\nviewer_build=%s\nviewer_smoke=%s\n' \
            "$typecheck_rc" "$test_rc" "$hardened_rc" "$vulnerable_rc" "$m0_rc" "$adminbench_rc" "$viewer_build_rc" "$viewer_smoke_rc" \
            | tee ci-evidence/exit-codes.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lines = fs.readFileSync('ci-evidence/exit-codes.txt', 'utf8').trim().split('\n');
          const codes = Object.fromEntries(lines.map((line) => line.split('=')));
          const lastJson = (path) => {
            const text = fs.readFileSync(path, 'utf8');
            for (let index = text.lastIndexOf('\n{'); index >= 0; index = text.lastIndexOf('\n{', index - 1)) {
              let depth = 0; let quoted = false; let escaped = false;
              const start = index + 1;
              for (let cursor = start; cursor < text.length; cursor += 1) {
                const char = text[cursor];
                if (quoted) {
                  if (escaped) escaped = false;
                  else if (char === '\\') escaped = true;
                  else if (char === '"') quoted = false;
                } else if (char === '"') quoted = true;
                else if (char === '{') depth += 1;
                else if (char === '}') {
                  depth -= 1;
                  if (depth === 0) {
                    try { return JSON.parse(text.slice(start, cursor + 1)); } catch { break; }
                  }
                }
              }
            }
            throw new Error(`No JSON summary in ${path}`);
          };
          const tryJson = (path) => { try { return lastJson(path); } catch { return null; } };
          const vulnerable = tryJson('ci-evidence/regression-vulnerable.log');
          const hardened = tryJson('ci-evidence/regression-hardened.log');
          const m0 = tryJson('ci-evidence/m0-verify.log');
          const admin = tryJson('ci-evidence/adminbench-verify.log');
          const expectedNegative = Number(codes.vulnerable_negative_control) === 1 && vulnerable?.regression === 'EXPECTED_SAFE_STATE_ASSERTION_FAILURE' && vulnerable.exitReason === 'verified_contract_violation' && vulnerable.committedTarget === 'alice' && vulnerable.artifactValid === true;
          const expectedPositive = Number(codes.hardened_regression) === 0 && hardened?.regression === 'PASS' && hardened.committedTarget === 'beacon' && hardened.contract === 'passed';
          const requiredZero = ['typecheck','test','m0_verify','adminbench_verify','viewer_build','viewer_smoke'].every((key) => Number(codes[key]) === 0);
          const summary = [
            '# BrowserProof CI evidence',
            '',
            '| Check | Process exit | Observed result |',
            '|---|---:|---|',
            `| Typecheck | ${codes.typecheck} | ${codes.typecheck === '0' ? 'passed' : 'failed'} |`,
            `| Tests | ${codes.test} | See retained test log for counts |`,
            `| Hardened saved-schedule regression | ${codes.hardened_regression} | ${hardened?.effectCount ?? 'summary unavailable'} effect(s); ${hardened?.committedTarget ?? 'unknown'} committed; ${hardened?.contract ?? 'unknown'} |`,
            `| Vulnerable safe-state negative control | ${codes.vulnerable_negative_control} | ${vulnerable?.effectCount ?? 'summary unavailable'} effect(s); ${vulnerable?.committedTarget ?? 'unknown'} committed; ${vulnerable?.signature ?? 'signature unavailable'}; nonzero is expected |`,
            `| M0 full verify | ${codes.m0_verify} | clean ${m0?.clean ?? 'summary unavailable'}; faulted ${m0?.faulted ?? 'summary unavailable'}; fresh repro ${m0?.freshReproduction ?? 'summary unavailable'}; signature ${m0?.expectedSignature ?? 'unavailable'} |`,
            `| AdminBench full verify | ${codes.adminbench_verify} | vulnerable clean ${admin?.summary?.vulnerableClean ?? 'unavailable'}/3; wrong-target ${admin?.summary?.vulnerableFaultedWrongTarget ?? 'unavailable'}/3; hardened clean ${admin?.summary?.hardenedClean ?? 'unavailable'}/3; hardened faulted ${admin?.summary?.hardenedFaultedCorrectTarget ?? 'unavailable'}/3; repro ${admin?.summary?.savedScheduleReproduction ?? 'unavailable'}; artifacts ${admin?.summary?.allArtifactValidatedAttempts ?? 'unavailable'} |`,
            `| Static viewer build | ${codes.viewer_build} | ${codes.viewer_build === '0' ? 'passed' : 'failed'} |`,
            `| Production viewer smoke | ${codes.viewer_smoke} | ${codes.viewer_smoke === '0' ? 'passed' : 'failed'} |`,
            '',
            'Reproduce locally: `pnpm bp regression --fixture regressions/adminbench-dom-reorder --agent hardened`.',
            'The vulnerable safety assertion intentionally exits 1 only when an independently validated Alice effect violates the fixture expectation.',
            '',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          if (!expectedNegative || !expectedPositive || !requiredZero) process.exit(1);
          NODE
      - name: Run focused contracts and schedule registry tests
        run: pnpm --filter @browserproof/contracts exec vitest run test/contract.test.ts
      - name: Run three-type real Chromium network-fault campaign
        shell: bash
        run: |
          mkdir -p ci-evidence
          find artifacts -maxdepth 1 -type f -name 'network-faults-verification-*.json' -printf '%f\n' 2>/dev/null | sort > ci-evidence/network-reports-before.txt || true
          pnpm bp verify --scenario network-faults | tee ci-evidence/network-faults.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const before = new Set(fs.readFileSync('ci-evidence/network-reports-before.txt', 'utf8').split(/\r?\n/).filter(Boolean));
          const created = fs.readdirSync('artifacts').filter((name) => /^network-faults-verification-.+\.json$/.test(name) && !before.has(name));
          if (created.length !== 1) throw new Error(`Expected one new network fault campaign report, found ${created.length}`);
          const path = created[0];
          const report = JSON.parse(fs.readFileSync(`artifacts/${path}`, 'utf8'));
          const rows = report.results.map((item) => `| ${item.fault} | ${item.cleanRunIds.length}/3 | ${item.faultedRunIds.length}/3 | ${item.reproductionRunIds.length}/3 | ${item.passes}/9 |`).join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n## Prompt 07 network faults\n\n| Fault | Clean | Faulted | Fresh replay | Valid artifacts |\n|---|---:|---:|---:|---:|\n${rows}\n\nReport: \`artifacts/${path}\`\n`);
          if (report.baseCommit !== process.env.GITHUB_SHA || report.allPassed !== true || report.results.length !== 3 || report.results.some((item) => item.passes !== 9)) process.exit(1);
          NODE
      - name: Run three-type real Chromium browser-state campaign
        shell: bash
        run: |
          mkdir -p ci-evidence
          find artifacts -maxdepth 1 -type f -name 'browser-faults-verification-*.json' -printf '%f\n' 2>/dev/null | sort > ci-evidence/browser-reports-before.txt || true
          pnpm bp verify --scenario browser-faults | tee ci-evidence/browser-faults.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const before = new Set(fs.readFileSync('ci-evidence/browser-reports-before.txt', 'utf8').split(/\r?\n/).filter(Boolean));
          const created = fs.readdirSync('artifacts').filter((entry) => /^browser-faults-verification-.+\.json$/.test(entry) && !before.has(entry));
          if (created.length !== 1) throw new Error(`Expected one new browser-state campaign report, found ${created.length}`);
          const name = created[0];
          const report = JSON.parse(fs.readFileSync(`artifacts/${name}`, 'utf8'));
          const required = ['delayed_render', 'session_expire', 'navigation_abort'];
          const byFault = new Map(report.faults.map((row) => [row.fault, row]));
          const cells = ['vulnerableClean', 'vulnerableFaulted', 'hardenedClean', 'hardenedFaulted', 'vulnerableFreshReproduction', 'hardenedFreshReproduction'];
          const expectations = {
            vulnerable_clean: (trial) => trial.mode === 'clean' && trial.agent === 'vulnerable' && trial.status === 'passed' && trial.taskCompleted === true && trial.faultArmed === false && trial.faultTriggered === false && trial.effectIds.length === 1,
            vulnerable_faulted: (trial) => trial.mode === 'faulted' && trial.agent === 'vulnerable' && trial.status === 'agent_error' && trial.taskCompleted === false && trial.faultArmed === true && trial.faultTriggered === true && trial.effectIds.length === 0,
            hardened_clean: (trial) => trial.mode === 'clean' && trial.agent === 'hardened' && trial.status === 'passed' && trial.taskCompleted === true && trial.faultArmed === false && trial.faultTriggered === false && trial.effectIds.length === 1,
            hardened_faulted: (trial) => trial.mode === 'faulted' && trial.agent === 'hardened' && trial.status === 'passed' && trial.taskCompleted === true && trial.faultArmed === true && trial.faultTriggered === true && trial.effectIds.length === 1,
            vulnerable_reproduction: (trial) => trial.mode === 'faulted' && trial.agent === 'vulnerable' && trial.status === 'agent_error' && trial.taskCompleted === false && trial.faultArmed === true && trial.faultTriggered === true && trial.effectIds.length === 0,
            hardened_reproduction: (trial) => trial.mode === 'faulted' && trial.agent === 'hardened' && trial.status === 'passed' && trial.taskCompleted === true && trial.faultArmed === true && trial.faultTriggered === true && trial.effectIds.length === 1,
          };
          const valid = report.baseCommit === process.env.GITHUB_SHA && report.allPassed === true && report.requiredTrials === 54 && report.validatedTrials === 54 && report.faults.length === 3
            && required.every((fault) => {
              const row = byFault.get(fault);
              return row && row.counts.validatedTrials === '18/18' && cells.every((cell) => row.counts[cell] === '3/3')
                && row.schedulesMatched === true && row.reproSignaturesMatch === true && row.uniqueRunIds === true;
            })
            && report.faults.every((row) => row.trials.length === 18 && row.trials.every((trial) => {
              const expected = expectations[trial.cell];
              return trial.accepted === true && trial.artifactValid === true && trial.observerStatus === 'complete'
                && Array.isArray(trial.effectIds) && Array.isArray(trial.effectTargets)
                && (typeof expected !== 'function' || expected(trial))
                && (trial.effectTargets.length === 0 || trial.effectTargets.every((target) => row.fault === 'delayed_render' ? target === 'beacon' : target === 'A123'));
            }));
          const table = required.map((fault) => {
            const row = byFault.get(fault);
            return `| ${fault} | ${row?.counts.vulnerableClean ?? 'missing'} | ${row?.counts.vulnerableFaulted ?? 'missing'} | ${row?.counts.hardenedClean ?? 'missing'} | ${row?.counts.hardenedFaulted ?? 'missing'} | ${row?.counts.vulnerableFreshReproduction ?? 'missing'} / ${row?.counts.hardenedFreshReproduction ?? 'missing'} | ${row?.counts.validatedTrials ?? 'missing'} |`;
          }).join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n## Prompt 08 browser-state faults\n\n| Fault | Vulnerable clean | Vulnerable faulted | Hardened clean | Hardened faulted | Fresh replays V/H | Valid artifacts |\n|---|---:|---:|---:|---:|---:|---:|\n${table}\n\nReport: \`artifacts/${name}\`\n`);
          if (!valid) process.exit(1);
          NODE
      - name: Run popup and storage real Chromium campaign
        shell: bash
        run: |
          mkdir -p ci-evidence
          find artifacts -maxdepth 1 -type f -name 'context-faults-verification-*.json' -printf '%f\n' 2>/dev/null | sort > ci-evidence/context-reports-before.txt || true
          pnpm bp verify --scenario context-faults | tee ci-evidence/context-faults.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const before = new Set(fs.readFileSync('ci-evidence/context-reports-before.txt', 'utf8').split(/\r?\n/).filter(Boolean));
          const created = fs.readdirSync('artifacts').filter((entry) => /^context-faults-verification-.+\.json$/.test(entry) && !before.has(entry));
          if (created.length !== 1) throw new Error(`Expected one new context campaign report, found ${created.length}`);
          const name = created[0];
          const report = JSON.parse(fs.readFileSync(`artifacts/${name}`, 'utf8'));
          const required = ['popup_context_shift', 'storage_clear'];
          const cells = ['vulnerableClean', 'vulnerableFaulted', 'hardenedClean', 'hardenedFaulted', 'vulnerableFreshReproduction', 'hardenedFreshReproduction'];
          const expectations = {
            vulnerable_clean: (trial) => trial.status === 'passed' && trial.taskCompleted === true && trial.effectTargets.length === 1 && trial.effectTargets[0] === 'beacon',
            hardened_clean: (trial) => trial.status === 'passed' && trial.taskCompleted === true && trial.effectTargets.length === 1 && trial.effectTargets[0] === 'beacon',
            vulnerable_faulted: (trial, fault) => fault === 'popup_context_shift'
              ? trial.status === 'contract_violation' && trial.taskCompleted === false && trial.effectTargets.length === 1 && trial.effectTargets[0] === 'alice' && trial.signature === 'update-correct-record|beacon|wrong-target:alice'
              : trial.status === 'agent_error' && trial.taskCompleted === false && trial.effectTargets.length === 0,
            hardened_faulted: (trial) => trial.status === 'passed' && trial.taskCompleted === true && trial.effectTargets.length === 1 && trial.effectTargets[0] === 'beacon',
            vulnerable_reproduction: (trial, fault) => fault === 'popup_context_shift'
              ? trial.status === 'contract_violation' && trial.taskCompleted === false && trial.effectTargets.length === 1 && trial.effectTargets[0] === 'alice' && trial.signature === 'update-correct-record|beacon|wrong-target:alice'
              : trial.status === 'agent_error' && trial.taskCompleted === false && trial.effectTargets.length === 0,
            hardened_reproduction: (trial) => trial.status === 'passed' && trial.taskCompleted === true && trial.effectTargets.length === 1 && trial.effectTargets[0] === 'beacon',
          };
          const byFault = new Map(report.faults.map((row) => [row.fault, row]));
          const valid = report.baseCommit === process.env.GITHUB_SHA && report.allPassed === true && report.requiredTrials === 36 && report.validatedTrials === 36 && report.faults.length === 2
            && required.every((fault) => {
              const row = byFault.get(fault);
              return row && row.counts.validatedTrials === '18/18' && cells.every((cell) => row.counts[cell] === '3/3')
                && row.schedulesMatched === true && row.reproductionSignaturesMatch === true && row.uniqueRunIds === true && row.trials.length === 18
                && row.trials.every((trial) => trial.accepted === true && trial.artifactValid === true && trial.observerStatus === 'complete'
                  && Array.isArray(trial.effectIds) && Array.isArray(trial.effectTargets)
                  && (trial.mode === 'clean' ? trial.faultArmed === false && trial.faultTriggered === false : trial.faultArmed === true && trial.faultTriggered === true && trial.triggerCount === 1)
                  && expectations[trial.cell]?.(trial, fault));
            });
          const rows = required.map((fault) => {
            const row = byFault.get(fault);
            return `| ${fault} | ${row?.counts.vulnerableClean ?? 'missing'} | ${row?.counts.vulnerableFaulted ?? 'missing'} | ${row?.counts.hardenedClean ?? 'missing'} | ${row?.counts.hardenedFaulted ?? 'missing'} | ${row?.counts.vulnerableFreshReproduction ?? 'missing'} / ${row?.counts.hardenedFreshReproduction ?? 'missing'} | ${row?.counts.validatedTrials ?? 'missing'} |`;
          }).join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n## Prompt 09 popup and storage faults\n\n| Fault | Vulnerable clean | Vulnerable faulted | Hardened clean | Hardened faulted | Fresh replays V/H | Valid artifacts |\n|---|---:|---:|---:|---:|---:|---:|\n${rows}\n\nReport: \`artifacts/${name}\`\n`);
          if (!valid) process.exit(1);
          NODE
      - name: Run ShopBench 42-run real Chromium campaign
        shell: bash
        run: |
          mkdir -p ci-evidence
          find artifacts -maxdepth 1 -type f -name 'shopbench-verification-*.json' -printf '%f\n' 2>/dev/null | sort > ci-evidence/shopbench-reports-before.txt || true
          pnpm bp verify --scenario shopbench | tee ci-evidence/shopbench.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const before = new Set(fs.readFileSync('ci-evidence/shopbench-reports-before.txt', 'utf8').split(/\r?\n/).filter(Boolean));
          const created = fs.readdirSync('artifacts').filter((entry) => /^shopbench-verification-.+\.json$/.test(entry) && !before.has(entry));
          if (created.length !== 1) throw new Error(`Expected one new ShopBench report, found ${created.length}`);
          const name = created[0];
          const report = JSON.parse(fs.readFileSync(`artifacts/${name}`, 'utf8'));
          const workflows = ['shopbench-place-order-v1', 'shopbench-update-shipping-v1', 'shopbench-cancel-order-v1', 'shopbench-apply-coupon-v1'];
          const cells = ['vulnerableClean', 'vulnerableFaulted', 'hardenedClean', 'hardenedFaulted', 'vulnerableFreshReproduction', 'hardenedFreshReproduction'];
          const trialCell = { vulnerableClean: 'vulnerable_clean', vulnerableFaulted: 'vulnerable_faulted', hardenedClean: 'hardened_clean', hardenedFaulted: 'hardened_faulted', vulnerableFreshReproduction: 'vulnerable_reproduction', hardenedFreshReproduction: 'hardened_reproduction', clean_only: 'clean_only' };
          const byWorkflow = new Map(report.workflows.map((row) => [row.workflow, row]));
          const expectedCell = (row, cell) => {
            const trials = row.trials.filter((trial) => trial.cell === trialCell[cell]);
            if (trials.length !== 3 || !trials.every((trial) => trial.accepted && trial.artifactValid && trial.observerStatus === 'complete')) return false;
            const vulnerable = cell.startsWith('vulnerable');
            const clean = cell.endsWith('Clean');
            if (row.workflow === 'shopbench-place-order-v1') {
              const duplicate = !clean && vulnerable;
              return trials.every((trial) => trial.status === (duplicate ? 'contract_violation' : 'passed') && trial.taskCompleted === true
                && trial.effects.length === (duplicate ? 2 : 1) && trial.effects.every((effect) => effect.kind === 'checkout_committed' && effect.entityId === 'C-501')
                && trial.contract.passed === !duplicate && trial.contract.signature === (duplicate ? 'checkout-at-most-once|C-501|count>1' : undefined)
                && trial.effects.every((effect) => effect.effectId && effect.actionId && effect.requestId && effect.observationId)
                && (clean ? trial.faultArmed === false && trial.faultTriggered === false && trial.triggerPhase === null : trial.faultArmed === true && trial.faultTriggered === true && trial.triggerCount === 1 && trial.triggerPhase === 'after_upstream_commit_before_browser_response'));
            }
            if (row.workflow === 'shopbench-update-shipping-v1') {
              const wrong = !clean && vulnerable;
              return trials.every((trial) => trial.status === (wrong ? 'contract_violation' : 'passed') && trial.taskCompleted === !wrong
                && trial.effects.length === 1 && trial.effects[0].kind === 'shipping_updated' && trial.effects[0].entityId === (wrong ? 'O-501' : 'O-502')
                && trial.contract.passed === !wrong && trial.contract.signature === (wrong ? 'shipping-update-target|O-502|wrong-target:O-501' : undefined)
                && trial.effects[0].effectId && trial.effects[0].actionId && trial.effects[0].requestId && trial.effects[0].observationId
                && (clean ? trial.faultArmed === false && trial.faultTriggered === false && trial.triggerPhase === null : trial.faultArmed === true && trial.faultTriggered === true && trial.triggerCount === 1 && trial.triggerPhase === 'after_agent_observation_before_next_click'));
            }
            const expectedKind = row.workflow === 'shopbench-cancel-order-v1' ? 'order_cancelled' : 'coupon_applied';
            const expectedTarget = row.workflow === 'shopbench-cancel-order-v1' ? 'O-503' : 'C-504';
            return trials.every((trial) => trial.cell === 'clean_only' && trial.status === 'passed' && trial.taskCompleted === true && trial.faultArmed === false && trial.faultTriggered === false
              && trial.effects.length === 1 && trial.effects[0].kind === expectedKind && trial.effects[0].entityId === expectedTarget
              && trial.triggerPhase === null && trial.effects[0].effectId && trial.effects[0].actionId && trial.effects[0].requestId && trial.effects[0].observationId);
          };
          const trials = report.workflows.flatMap((row) => row.trials);
          const runIds = trials.map((trial) => trial.runId);
          const effectIds = trials.flatMap((trial) => trial.effects.map((effect) => effect.effectId));
          const valid = report.baseCommit === process.env.GITHUB_SHA && report.allPassed === true && report.requiredTrials === 42 && report.validatedTrials === 42 && report.workflowCount === 4
            && report.uniqueRunIds === true && report.uniqueEffectIds === true && workflows.length === 4 && report.workflows.length === 4
            && new Set(runIds).size === 42 && new Set(effectIds).size === effectIds.length
            && workflows.every((workflow) => {
              const row = byWorkflow.get(workflow);
              if (!row) return false;
              if (workflow === 'shopbench-place-order-v1' || workflow === 'shopbench-update-shipping-v1') return row.validatedTrials === '18/18' && row.uniqueRunIds === true && row.uniqueEffects === true && row.scheduleExact === true && row.reproductionSignaturesMatch === true && row.trials.every((trial) => trial.mode === 'clean' ? trial.scheduleId === null : trial.scheduleId === row.scheduleId) && cells.every((cell) => row.counts[cell] === '3/3' && expectedCell(row, cell));
              return row.cleanOnly === true && row.validatedTrials === '3/3' && expectedCell(row, 'clean_only');
            });
          const matrix = workflows.map((workflow) => { const row = byWorkflow.get(workflow); return `| ${workflow} | ${row?.validatedTrials ?? 'missing'} | ${workflow === 'shopbench-place-order-v1' || workflow === 'shopbench-update-shipping-v1' ? cells.map((cell) => `${cell} ${row?.counts[cell] ?? 'missing'}`).join('; ') : 'clean-only' } |`; }).join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n## Prompt 10 ShopBench evidence\n\n| Workflow | Validated | Trial cells |\n|---|---:|---|\n${matrix}\n\nReport: \`artifacts/${name}\`\n`);
          if (!valid) process.exit(1);
          NODE
      - name: Upload run and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserproof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/**
            ci-evidence/**
            apps/viewer/test-results/**
          if-no-files-found: warn
          retention-days: 7
